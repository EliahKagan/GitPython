[build-system]
requires = ["setuptools >= 62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "GitPython"
description = "GitPython is a Python library used to interact with Git repositories"
authors = [
    {name = "Sebastian Thiel", email = "byronimo@gmail.com"},
    {name = "Michael Trier", email = "mtrier@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["git"]
# license = "BSD-3-Clause"  # not done until setuptools >= 77 (Python >= 3.9)
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["license", "version", "dependencies", "optional-dependencies"]

[project.urls]
"Source code" = "https://github.com/gitpython-developers/GitPython"
"Documentation" = "https://gitpython.readthedocs.io/en/stable/"
"Changelog" = "https://github.com/gitpython-developers/GitPython/blob/main/doc/source/changes.rst"

[dependency-groups]
doc = [
    'sphinx >=7.4.7,<8 ; python_version >= "3.9"',
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requirements.txt"}
optional-dependencies."test" = {file = "test-requirements.txt"}
optional-dependencies."gix" = {file = "gix-requirements.txt"}

[tool.setuptools.packages.find]
include = ["git", "git.*"]

[tool.pytest.ini_options]
addopts = "--cov=git --cov-report=term -rfEX"
filterwarnings = "ignore::DeprecationWarning"
python_files = "test_*.py"
tmp_path_retention_policy = "failed"
testpaths = "test"  # Space separated list of paths from root e.g test tests doc/testing.
# --cov   coverage
# --cov-report term  # send report to terminal term-missing -> terminal with line numbers  html  xml
# --cov-report term-missing # to terminal with line numbers
# --cov-report html:path  # html file at path
# --maxfail  # number of errors before giving up
# -rfEX  # test summary: list failures, errors, and unexpected passes; omit expected failures
# -ra   # test summary: list all non-passing (fail, error, skip, xfail, xpass)
# --ignore-glob=**/gitdb/*  # ignore glob paths
# filterwarnings ignore::WarningType  # ignores those warnings

[tool.mypy]
files = ["git/", "test/test_typing.py", "test/test_remote_progress.py"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
implicit_reexport = true
# strict = true
# TODO: Remove when 'gitdb' is fully annotated.
exclude = ["^(gitdb|smmap)/"]
[[tool.mypy.overrides]]
module = ["gitdb", "gitdb.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.8"
include = [
    "git",
    "test/test_typing.py",
    "test/test_git.py",
    "test/test_remote_progress.py",
]
extraPaths = [
    "gitdb",
    "smmap",
]
exclude = [
    "gitdb",
    "smmap",
]

[tool.coverage.run]
source = ["git"]

[tool.coverage.report]
include = ["*/git/*"]
omit = ["*/git/ext/*"]

[tool.ruff]
line-length = 120
# Exclude a variety of commonly ignored directories.
exclude = [
    "git/ext/",
    "gitdb/",
    "smmap/",
    "build",
    "dist",
]
# Enable Pyflakes `E` and `F` codes by default.
lint.select = [
    "E",
    "W",     # See: https://pypi.org/project/pycodestyle
    "F",     # See: https://pypi.org/project/pyflakes
    # "I",   # See: https://pypi.org/project/isort/
    # "S",   # See: https://pypi.org/project/flake8-bandit
    # "UP",  # See: https://docs.astral.sh/ruff/rules/#pyupgrade-up
]
lint.extend-select = [
    # "A",    # See: https://pypi.org/project/flake8-builtins
    "B",      # See: https://pypi.org/project/flake8-bugbear
    "C4",     # See: https://pypi.org/project/flake8-comprehensions
    "TC004",  # See: https://docs.astral.sh/ruff/rules/runtime-import-in-type-checking-block/
]
lint.ignore = [
    # If it becomes necessary to ignore any rules, list them here.
]
lint.unfixable = [
    "F401",  # Module imported but unused
]

[tool.ruff.lint.per-file-ignores]
"test/**" = [
    "B018",  # useless-expression
]
"fuzzing/fuzz-targets/**" = [
  "E402",  # environment setup must happen before the `git` module is imported, thus cannot happen at top of file
]

[tool.tox]
requires = ["tox>=4.41"]
# tox older than 4.41 reads only this, and provisions a newer tox, which reads the rest.
legacy_tox_ini = """
[tox]
requires = tox>=4.41
"""
# Skip environments whose Python is not installed. The `tox` workflow overrides this.
skip_missing_interpreters = true
env_list = [
    "py38",
    "py39",
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "ruff",
    "format",
    "mypy",
    "html",
    "misc",
]

[tool.tox.env_run_base]
description = "Run unit tests"
package = "wheel"
# Use the in-tree smmap and gitdb, as CI does, rather than releases from PyPI.
deps = ["{tox_root}/smmap", "{tox_root}/gitdb"]
extras = ["test"]
pass_env = [
    "SSH_*",
    "GIT_PYTHON_GIT_EXECUTABLE",
]
set_env = { GIT_PYTHON_BACKEND = "cli" }
commands = [["pytest", "--color=yes", { replace = "posargs", extend = true }]]

[tool.tox.env.py38]
description = "Install and import GitPython (the tests need Python 3.11 or later)"
extras = []
commands = [
    ["python", "-I", "-c", "import git; from git import _backend; assert _backend.name == 'cli'; print(git.__version__)"],
]

[tool.tox.env.py39]
description = "Install and import GitPython (the tests need Python 3.11 or later)"
extras = []
commands = [
    ["python", "-I", "-c", "import git; from git import _backend; assert _backend.name == 'cli'; print(git.__version__)"],
]

[tool.tox.env.py310]
description = "Install and import GitPython (the tests need Python 3.11 or later)"
extras = []
commands = [
    ["python", "-I", "-c", "import git; from git import _backend; assert _backend.name == 'cli'; print(git.__version__)"],
]

[tool.tox.env.ruff]
description = "Lint with Ruff"
base_python = ["py39", "py310", "py311", "py312", "py313", "py314", "py315"]
skip_install = true
deps = ["ruff"]
set_env = { CLICOLOR_FORCE = "1" }  # Set NO_COLOR to override this.
commands = [["ruff", "check", "."]]

[tool.tox.env.gix]
# Let tests download packages, as `test/run-local.py` otherwise forbids, unless `PIP_NO_INDEX` is already set.
set_env = { GIT_PYTHON_BACKEND = "gix", PIP_NO_INDEX = { replace = "env", name = "PIP_NO_INDEX", default = "0" } }
description = "Run the suite with released GixPython and CLI fallback"
base_python = ["python3"]
package_env = ".pkg-gix"
wheel_build_env = ".pkg-gix"
extras = ["test", "gix"]
commands = [
    [
        "python",
        "test/run-local.py",
        { replace = "posargs", default = ["--backend-report=.cache/gix-coverage.json"], extend = true },
    ],
]

[tool.tox.env.format]
description = "Check formatting with Ruff"
base_python = ["py39", "py310", "py311", "py312", "py313", "py314", "py315"]
skip_install = true
deps = ["ruff"]
set_env = { CLICOLOR_FORCE = "1" }  # Set NO_COLOR to override this.
commands = [["ruff", "format", "--check", "."]]

[tool.tox.env.mypy]
description = "Typecheck with mypy"
base_python = ["py39", "py310", "py311", "py312", "py313", "py314", "py315"]
set_env = { MYPY_FORCE_COLOR = "1" }
commands = [["mypy"]]

[tool.tox.env.html]
description = "Build HTML documentation"
base_python = ["py39", "py310", "py311", "py312", "py313", "py314", "py315"]
extras = []
dependency_groups = ["doc"]
allowlist_externals = ["make"]
commands = [
    ["make", "BUILDDIR={env_tmp_dir}/doc/build", "-C", "doc", "clean"],
    ["make", "BUILDDIR={env_tmp_dir}/doc/build", "-C", "doc", "html"],
]

[tool.tox.env.misc]
description = "Run other checks via pre-commit"
base_python = ["py39", "py310", "py311", "py312", "py313", "py314", "py315"]
skip_install = true
deps = ["pre-commit"]
set_env = { SKIP = "ruff-format,ruff-check" }
commands = [["pre-commit", "run", "--all-files"]]

# Environments that the `tox` workflow runs for each Python version, via tox-gh.
# tox-gh does nothing outside GitHub Actions.
[tool.tox.gh.python]
"3.8" = ["py38"]
"3.9" = ["py39"]
"3.10" = ["py310"]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313", "gix", "ruff", "format", "mypy", "html", "misc"]
"3.14" = ["py314"]
"3.15" = ["py315"]
